name: Refresh approved records

# Approved CDSS records lag about a year, so re-pull recent years monthly and
# rebuild the day-of-year stats and water rights. Same variables and secrets
# as daily_fetch.yml.
on:
  schedule:
    # 1st of the month, 14:00 UTC
    - cron: '0 14 1 * *'
  workflow_dispatch:
    inputs:
      start_year:
        description: 'First year to re-pull. Blank for two years ago.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: s3-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TBD_DATA_ROOT: s3://${{ vars.TBD_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      API_USGS_PAT: ${{ secrets.API_USGS_PAT }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::dplyr
            any::tidyr
            any::tibble
            any::purrr
            any::lubridate
            any::readr
            any::arrow

      - name: Write API key file
        run: echo "$CDSS_API_KEY" > scripts/api_key.txt
        env:
          CDSS_API_KEY: ${{ secrets.CDSS_API_KEY }}

      - name: Set start year
        run: echo "START_YEAR=${INPUT_START:-$(( $(date +%Y) - 2 ))}" >> "$GITHUB_ENV"
        env:
          INPUT_START: ${{ inputs.start_year }}

      - name: Monthly diversion records
        run: BACKFILL_START_YEAR=$START_YEAR Rscript scripts/backfill_history.R

      - name: Daily diversion records
        run: RECORDS_START=$START_YEAR-01-01 Rscript scripts/backfill_daily_records.R

      - name: Reservoir storage
        run: RESERVOIR_START_YEAR=$START_YEAR Rscript scripts/backfill_reservoirs.R

      - name: Day-of-year stats
        run: Rscript scripts/build_flow_stats.R

      - name: Water rights
        run: Rscript scripts/build_water_rights.R
