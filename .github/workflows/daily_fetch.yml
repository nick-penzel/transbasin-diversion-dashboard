name: Daily fetch (diversions + streamflow)

# Schedule disabled for Stage 1 (local storage). Re-enable in Stage 2 once
# scripts write to S3.
on:
  # schedule:
  #   # 13:30 UTC = 7:30 AM Mountain (MDT) / 6:30 AM (MST).
  #   - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::dplyr
            any::tibble
            any::lubridate
            any::readr
            any::arrow
            any::piggyback
            any::dataRetrieval
            any::sf

      - name: Write API key file
        run: echo "$CDSS_API_KEY" > scripts/api_key.txt
        env:
          CDSS_API_KEY: ${{ secrets.CDSS_API_KEY }}

      - name: Run daily fetch
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: Rscript scripts/daily_fetch.R